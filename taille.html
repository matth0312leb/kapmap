<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Taille de l'écran</title>
<style>body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0e0e0f;color:#f5f5f5;font-family:system-ui,sans-serif;text-align:center}b{font-size:64px;display:block}span{color:#9a9a9a;font-size:20px}</style></head>
<body><div><b id="s"></b><span id="d"></span></div>
<script>
function show(){document.getElementById('s').textContent=innerWidth+' × '+innerHeight;document.getElementById('d').textContent='Densité : '+devicePixelRatio+' · Envoie ces chiffres à Claude';}
show(); addEventListener('resize',show);
</script></body></html>
